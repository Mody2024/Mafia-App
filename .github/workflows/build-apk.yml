name: Build Offline APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Node Packages
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android --save

      - name: Build Web App
        run: npm run build

      - name: Initialize Capacitor & Add Android
        run: |
          npx cap init "Mafia App" "com.mody2024.mafiaapp" --web-dir dist --yes || true
          npx cap add android || true
          npx cap sync android

      - name: Compile APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Mafia-Offline-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
